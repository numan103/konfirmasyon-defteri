<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t">
  <title id="t">Tartışan ve fikir alışverişi yapan trader topluluğu</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2038"/>
      <stop offset=".6" stop-color="#0d1120"/>
      <stop offset="1" stop-color="#06070d"/>
    </linearGradient>
    <radialGradient id="gv" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8b7cf6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="laptopGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9be7ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9be7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f0a36b" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f0a36b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123049"/>
      <stop offset="1" stop-color="#0a1524"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft8" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="900" height="600" fill="url(#bg)"/>

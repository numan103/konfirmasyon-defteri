<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t">
  <title id="t">Birlikte tartışan ve fikir alışverişi yapan traderlar</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222b45"/>
      <stop offset=".6" stop-color="#131a2b"/>
      <stop offset="1" stop-color="#0a0d16"/>
    </linearGradient>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffc27a" stop-opacity=".36"/>
      <stop offset="1" stop-color="#ffc27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4ad9c0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4ad9c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a33"/>
      <stop offset="1" stop-color="#221b1a"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#bg)"/>
  <ellipse cx="450" cy="240" rx="420" ry="300" fill="url(#warm)"/>
  <ellipse cx="760" cy="120" rx="260" ry="220" fill="url(#teal)"/>

  <!-- arka planda sıcak kafe ışıkları -->
  <g opacity=".55">
    <circle cx="100" cy="90" r="26" fill="#ffd89b" opacity=".18"/>
    <circle cx="100" cy="90" r="8" fill="#ffd89b" opacity=".5"/>
    <circle cx="780" cy="70" r="22" fill="#ffd89b" opacity=".16"/>
    <circle cx="780" cy="70" r="7" fill="#ffd89b" opacity=".45"/>
    <path d="M0 300h900" stroke="#2c3655" stroke-width="2" opacity=".6"/>
  </g>

  <!-- ortadaki dizüstü (paylaşılan grafik) -->
  <g>
    <path d="M370 330h160l14 100H356z" fill="#0a0e1a" stroke="#394462" stroke-width="3"/>
    <rect x="380" y="338" width="140" height="84" rx="5" fill="#141d33"/>
    <g fill="#5eead4" opacity=".7">
      <rect x="390" y="388" width="10" height="24" rx="3"/><rect x="406" y="376" width="10" height="36" rx="3"/>
      <rect x="422" y="384" width="10" height="28" rx="3"/><rect x="438" y="364" width="10" height="48" rx="3"/>
      <rect x="454" y="372" width="10" height="40" rx="3"/><rect x="470" y="356" width="10" height="56" rx="3"/>
      <rect x="486" y="366" width="10" height="46" rx="3"/>
    </g>
    <rect x="356" y="430" width="188" height="10" rx="5" fill="#2a3350"/>
  </g>

  <!-- masa -->
  <path d="M0 440q450-26 900 0v160H0z" fill="url(#desk)"/>
  <path d="M0 440q450-26 900 0" fill="none" stroke="#6b5346" stroke-width="3" opacity=".7"/>

  <!-- sol trader (anlatan) -->
  <g>
    <path d="M100 440q-8-92 44-118h104q52 26 44 118z" fill="#1b2338"/>
    <path d="M120 440q4-76 50-94 24-8 48 0 46 18 50 94z" fill="#6b5b92"/>
    <rect x="192" y="296" width="30" height="28" rx="10" fill="#b87d5b"/>
    <ellipse cx="207" cy="258" rx="48" ry="54" fill="#d49a72"/>
    <path d="M160 252q-4-54 47-58 52 2 47 60-10-24-28-24-14 12-36 4-18 8-30 18z" fill="#2f2733"/>
    <path d="M190 272q8-6 16 0M216 272q8-6 16 0" fill="none" stroke="#3a2f2a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="198" cy="282" rx="4" ry="5" fill="#2a2330"/>
    <ellipse cx="224" cy="282" rx="4" ry="5" fill="#2a2330"/>
    <path d="M198 306q12 10 26 0" fill="none" stroke="#8f5746" stroke-width="3.5" stroke-linecap="round"/>
    <!-- jest yapan kol -->
    <path d="M270 370q46-14 76-48" fill="none" stroke="#6b5b92" stroke-width="28" stroke-linecap="round"/>
    <ellipse cx="350" cy="318" rx="16" ry="12" fill="#d49a72" transform="rotate(-30 350 318)"/>
  </g>

  <!-- sağ trader (dinleyen, gülümseyen) -->
  <g>
    <path d="M620 440q-8-92 44-118h104q52 26 44 118z" fill="#1b2338"/>
    <path d="M640 440q4-76 50-94 24-8 48 0 46 18 50 94z" fill="#8a5c56"/>
    <rect x="712" y="296" width="30" height="28" rx="10" fill="#8b5e42"/>
    <ellipse cx="727" cy="258" rx="48" ry="54" fill="#a9764f"/>
    <path d="M680 256q0-56 47-58 50 2 47 56-16-20-30-18-18 10-38 0-14 8-26 20z" fill="#241f28"/>
    <path d="M710 274q8-6 16 0M736 274q8-6 16 0" fill="none" stroke="#2a2320" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="718" cy="284" rx="4" ry="5" fill="#241f28"/>
    <ellipse cx="744" cy="284" rx="4" ry="5" fill="#241f28"/>
    <path d="M710 306q16 16 34 0" fill="none" stroke="#6f4236" stroke-width="4" stroke-linecap="round"/>
    <!-- masaya yaslanan kol -->
    <path d="M660 380q-40 20-56 52" fill="none" stroke="#8a5c56" stroke-width="28" stroke-linecap="round"/>
    <ellipse cx="600" cy="436" rx="16" ry="11" fill="#a9764f" transform="rotate(20 600 436)"/>
  </g>

  <!-- arka trader (arkada, profil) -->
  <g opacity=".92">
    <path d="M420 340q-6-64 32-82h70q38 18 32 82z" fill="#33566b"/>
    <ellipse cx="482" cy="232" rx="38" ry="42" fill="#c98f68"/>
    <path d="M446 228q0-44 36-46 38 2 36 44-12-18-24-16-14 8-28 0-10 6-20 18z" fill="#3a2f2e"/>
    <ellipse cx="470" cy="246" rx="3.5" ry="4.5" fill="#2a2330"/>
    <ellipse cx="494" cy="246" rx="3.5" ry="4.5" fill="#2a2330"/>
    <path d="M472 264q10 8 20 0" fill="none" stroke="#8f5746" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- kahveler -->
  <g>
    <ellipse cx="300" cy="470" rx="28" ry="9" fill="#0c101c" opacity=".7"/>
    <path d="M276 424h48l-6 40a10 10 0 0 1-10 8h-16a10 10 0 0 1-10-8z" fill="#efe6d6"/>
    <ellipse cx="300" cy="424" rx="24" ry="7" fill="#6b4a35"/>
  </g>
  <g>
    <ellipse cx="600" cy="480" rx="28" ry="9" fill="#0c101c" opacity=".7"/>
    <path d="M576 434h48l-6 40a10 10 0 0 1-10 8h-16a10 10 0 0 1-10-8z" fill="#efe6d6"/>
    <ellipse cx="600" cy="434" rx="24" ry="7" fill="#6b4a35"/>
  </g>

  <!-- sohbet balonları -->
  <g>
    <path d="M520 140q0-22 24-22h96q24 0 24 22v34q0 22-24 22h-58l-22 20v-20q-40 0-40-34z" fill="#2a3350" stroke="#4a5578" stroke-width="2"/>
    <g fill="#8b97c0"><circle cx="556" cy="157" r="4"/><circle cx="580" cy="157" r="4"/><circle cx="604" cy="157" r="4"/></g>
    <path d="M170 130q0-20 22-20h84q22 0 22 20v30q0 20-22 20h-50l-20 18v-18q-36 0-36-30z" fill="#23594f" stroke="#3f8f80" stroke-width="2"/>
    <g fill="#7fe3d0"><circle cx="204" cy="145" r="4"/><circle cx="226" cy="145" r="4"/><circle cx="248" cy="145" r="4"/></g>
  </g>

  <g fill="#fff" opacity=".035">
    <circle cx="80" cy="360" r="2"/><circle cx="840" cy="350" r="1.6"/><circle cx="450" cy="80" r="2"/>
  </g>
</svg>
